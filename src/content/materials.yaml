    text: "Kahendarvud on pikad ja neid on raske lugeda. Kuueteistkümnendsüsteemis vastab üks number täpselt neljale bitile, seepärast kasutavad seda programmeerijad ja veebivärvid. Loe konspekt, mängi värvimängu ja tee kodutöö. Kui oled valmis, proovi põgenemistuba ja vaata lisamaterjale lehe lõpus.\nKodutöö: ava PDF nupuga „Vaata“, täida lahtrid otse veebis, vajuta „Laadi täidetud PDF alla“ ja saada fail aadressile mtsopo@taltech.ee."
